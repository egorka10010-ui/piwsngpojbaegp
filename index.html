<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#040705">
<title>EarthVPN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#040705;--panel:#0a130c;--line:#17361f;--neon:#39ff14;--text:#e9ffe9;--muted:#7da587;
--glow:0 0 22px rgba(57,255,20,.35);--d:'Unbounded','Manrope',system-ui,sans-serif;--b:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:var(--b);color:var(--text);line-height:1.5;max-width:520px;margin:0 auto;min-height:100vh;
padding:env(safe-area-inset-top,0px) 18px calc(28px + env(safe-area-inset-bottom,0px));
background-image:radial-gradient(120% 60% at 50% -10%,rgba(57,255,20,.13),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 4px}
.logo{font-family:var(--d);font-weight:700;font-size:18px}
.logo span{color:var(--neon);text-shadow:0 0 14px rgba(57,255,20,.7)}
.pill{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.pill i{width:7px;height:7px;border-radius:50%;background:#4f7d5a}
.pill.on{color:var(--text)}.pill.on i{background:var(--neon);box-shadow:0 0 10px var(--neon);animation:pulse 2s infinite}

main{text-align:center}
.power{position:relative;width:min(74vw,280px);aspect-ratio:1;margin:18px auto 0;display:grid;place-items:center}
.globe{position:absolute;inset:0;width:100%;height:100%;opacity:.36;filter:drop-shadow(0 0 12px rgba(57,255,20,.5))}
.globe *{vector-effect:non-scaling-stroke}
.node{animation:pulse 2.4s infinite;transform-box:fill-box;transform-origin:center}
.pbtn{position:relative;z-index:1;width:58%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
background:radial-gradient(circle at 50% 36%,#10301a,#050b06 70%);border:3px solid var(--neon);
box-shadow:0 0 36px rgba(57,255,20,.5),inset 0 0 30px rgba(57,255,20,.2);transition:box-shadow .3s,border-color .3s,background .3s,transform .15s}
.pbtn:active{transform:scale(.95)}
.pbtn svg{width:42%;height:auto;stroke:var(--neon);stroke-width:5;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 8px rgba(57,255,20,.85));transition:stroke .3s}
.pbtn::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--neon);opacity:0;pointer-events:none}
.pbtn::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid transparent;border-top-color:var(--neon);opacity:0;pointer-events:none}
.power[data-state=idle] .pbtn::after{animation:ring 2.6s ease-out infinite}
.power[data-state=connecting] .pbtn::before{opacity:1;animation:spin .9s linear infinite}
.power[data-state=nosub] .pbtn,.power[data-state=blocked] .pbtn{border-color:#2d4d35;box-shadow:inset 0 0 24px rgba(57,255,20,.05)}
.power[data-state=nosub] .pbtn svg,.power[data-state=blocked] .pbtn svg{stroke:#4f7d5a;filter:none}
.power[data-state=opened] .pbtn{background:var(--neon);box-shadow:0 0 56px rgba(57,255,20,.75)}
.power[data-state=opened] .pbtn svg{stroke:#031004;filter:none}

.plabel{font-family:var(--d);font-weight:700;font-size:17px;margin-top:12px}
.psub{color:var(--muted);font-size:13.5px;margin:4px auto 0;max-width:32ch}
.card{margin:18px auto 0;max-width:340px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.card b{color:var(--neon);font-weight:800}
.actions{display:grid;gap:10px;margin-top:20px}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-family:var(--d);font-weight:700;font-size:14.5px;text-align:center;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--neon);color:#031004;box-shadow:0 0 28px rgba(57,255,20,.45)}
.btn.s{border:1.5px solid var(--neon);color:var(--neon)}
.dl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.dl button{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--muted)}

/* окно с тарифами */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:#07100a;border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s ease;box-shadow:0 -10px 40px rgba(57,255,20,.12)}
body.sheet-on .shade{opacity:1;pointer-events:auto}
body.sheet-on .sheet{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sh h2{font-family:var(--d);font-weight:700;font-size:17px}
.sh button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:16px}
.plans{display:grid;gap:12px;margin-bottom:16px}
.plan{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;padding:15px 18px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;transition:border-color .18s,box-shadow .18s}
.plan[aria-checked=true]{border-color:var(--neon);box-shadow:var(--glow),inset 0 0 28px rgba(57,255,20,.07)}
.plan .n{font-weight:800;font-size:16px}.plan .m{color:var(--muted);font-size:13px}
.plan .p{font-family:var(--d);font-weight:700;font-size:20px;grid-row:1/3;grid-column:2;text-align:right;color:var(--neon);text-shadow:0 0 16px rgba(57,255,20,.45)}
.tag{position:absolute;top:-10px;left:16px;background:var(--neon);color:#031004;font-size:11px;font-weight:800;padding:2px 10px;border-radius:99px}

.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;background:var(--panel);border:1px solid var(--neon);padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:600;transition:.25s;z-index:60;pointer-events:none;text-align:center;width:max-content;max-width:88vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* переход в Happ (страница открывается во внешнем браузере) */
.open{position:fixed;inset:0;z-index:50;display:grid;align-content:center;justify-items:center;text-align:center;padding:24px;background:var(--bg);
background-image:radial-gradient(100% 50% at 50% 0,rgba(57,255,20,.14),transparent 65%)}
.open .dot{width:74px;height:74px;margin-bottom:22px;border-radius:50%;border:3px solid var(--neon);box-shadow:0 0 34px rgba(57,255,20,.5);animation:pulse 1.6s infinite}
.open h1{font-family:var(--d);font-size:22px;color:var(--neon);text-shadow:0 0 18px rgba(57,255,20,.5)}
.open p{color:var(--muted);margin:10px 0 22px;max-width:30ch;font-size:15px}
.open a{display:block;width:min(320px,100%);margin:10px 0;padding:15px;border-radius:14px;text-decoration:none;font-weight:700;border:1.5px solid var(--neon);color:var(--neon)}
.open a.main{background:var(--neon);color:#031004;box-shadow:0 0 26px rgba(57,255,20,.45)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{from{transform:scale(.94);opacity:.6}to{transform:scale(1.2);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">Earth<span>VPN</span></div>
  <div class="pill" id="pill"><i></i><span id="pilltxt">Нет подписки</span></div>
</header>

<main>
  <div class="power" id="power" data-state="nosub">
    <svg class="globe" id="globe" viewBox="0 0 240 240" fill="none" stroke="#39ff14" stroke-width="1.6" aria-hidden="true">
      <circle cx="120" cy="120" r="100" stroke-width="2.4"/>
      <g opacity=".55">
        <line x1="20" y1="120" x2="220" y2="120"/>
        <line x1="33.4" y1="70" x2="206.6" y2="70"/><line x1="33.4" y1="170" x2="206.6" y2="170"/>
        <line x1="70" y1="33.4" x2="170" y2="33.4"/><line x1="70" y1="206.6" x2="170" y2="206.6"/>
      </g>
      <g opacity=".7">
        <ellipse cx="120" cy="120" rx="100" ry="100"><animate attributeName="rx" values="100;71;0;71;100" keyTimes="0;.25;.5;.75;1" dur="14s" begin="0s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="120" cy="120" rx="100" ry="100"><animate attributeName="rx" values="100;71;0;71;100" keyTimes="0;.25;.5;.75;1" dur="14s" begin="-3.5s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="120" cy="120" rx="100" ry="100"><animate attributeName="rx" values="100;71;0;71;100" keyTimes="0;.25;.5;.75;1" dur="14s" begin="-7s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="120" cy="120" rx="100" ry="100"><animate attributeName="rx" values="100;71;0;71;100" keyTimes="0;.25;.5;.75;1" dur="14s" begin="-10.5s" repeatCount="indefinite"/></ellipse>
      </g>
      <g fill="#39ff14" stroke="none">
        <circle class="node" cx="92" cy="88" r="4"/><circle class="node" cx="150" cy="104" r="4" style="animation-delay:.6s"/>
        <circle class="node" cx="116" cy="152" r="4" style="animation-delay:1.2s"/><circle class="node" cx="168" cy="146" r="3" style="animation-delay:1.8s"/>
      </g>
    </svg>
    <button class="pbtn" id="pbtn" aria-label="Включить VPN">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8v22"/><path d="M19 17a22 22 0 1 0 26 0"/></svg>
    </button>
  </div>
  <div class="plabel" id="plabel"></div>
  <p class="psub" id="psub"></p>

  <div class="card" id="card" hidden><span id="cardL"></span><b id="cardR"></b></div>

  <div class="actions">
    <button class="btn p" id="trialBtn" hidden>Пробный период 3 дня</button>
    <button class="btn p" id="chBtn" hidden>Подписаться на канал</button>
    <button class="btn s" id="plansBtn">Тарифы</button>
  </div>

  <div class="dl"><button id="dlIos">Happ в App Store</button><button id="dlOther">Другие платформы</button></div>
</main>

<div class="shade" id="shade"></div>
<section class="sheet" id="sheet" aria-label="Тарифы">
  <div class="sh"><h2>Выберите тариф</h2><button id="closeSheet" aria-label="Закрыть">✕</button></div>
  <div class="plans" id="plans" role="radiogroup" aria-label="Тариф"></div>
  <button class="btn p" id="buy"></button>
</section>
<div class="toast" id="toast" role="status"></div>

<div class="open" id="openView" hidden>
  <div class="dot"></div>
  <h1 id="ot">Открываю Happ</h1>
  <p id="os">Если появится запрос, разрешите открыть приложение.</p>
  <a class="main" id="oOpen" href="#">Открыть Happ</a>
  <a href="https://apps.apple.com/us/app/happ-proxy-utility/id6504287215">Установить Happ (App Store)</a>
  <a href="https://www.happ.su">Другие платформы</a>
</div>

<script>
const PLANS=[
  {id:'1m',n:'1 месяц',p:199,mo:199},
  {id:'3m',n:'3 месяца',p:499,mo:166,tag:'Популярный'},
  {id:'12m',n:'12 месяцев',p:1690,mo:141,tag:'Выгодно'}
];
const $=s=>document.querySelector(s);
const rub=n=>n.toLocaleString('ru-RU')+' ₽';
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#040705');tg.setBackgroundColor('#040705');}catch(e){}}
if(matchMedia('(prefers-reduced-motion: reduce)').matches){try{$('#globe').pauseAnimations();}catch(e){}}

/* ---- статус пользователя приходит из бота в адресе страницы ---- */
const Q=new URLSearchParams(location.search);
const SUB=Q.get('sub')||'', EXP=+Q.get('exp')||0, TRIAL_USED=Q.get('trial')==='1', ON_TRIAL=Q.get('tact')==='1',
      BLOCKED=Q.get('blk')==='1', CH=Q.get('ch')||'', BOT=Q.get('bot')||'';
if(SUB){try{history.replaceState(null,'',location.pathname+(BOT?'?bot='+encodeURIComponent(BOT):''));}catch(e){}}
const NOW=Date.now()/1000;
const ACTIVE=!!SUB&&EXP>NOW&&!BLOCKED;
const IS_BLOCKED=!!SUB&&BLOCKED&&EXP>NOW;
const EXPIRED=!!SUB&&EXP<=NOW;

function haptic(k){try{k?tg.HapticFeedback.impactOccurred(k):tg.HapticFeedback.selectionChanged();}catch(e){}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2400);}
function openExt(u){if(tg&&tg.openLink)tg.openLink(u);else window.open(u,'_blank');}
function toBot(start){
  if(!BOT){toast('Откройте приложение через бота в Telegram');return;}
  const url='https://t.me/'+encodeURIComponent(BOT)+'?start='+start;
  haptic('medium');
  if(tg&&tg.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank');
}

/* ---- главный экран ---- */
const PW=$('#power');
const dt=ts=>new Date(ts*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const TXT={
  nosub:EXPIRED?['Подписка закончилась','Продлите подписку, чтобы подключиться']
              :TRIAL_USED?['Нет активной подписки','Оформите тариф, чтобы подключиться']
                         :['Нет активной подписки','Попробуйте бесплатно 3 дня или оформите тариф'],
  blocked:['Пробный период заблокирован','Вы отписались от канала. Подпишитесь снова, чтобы продолжить'],
  idle:['Нажмите, чтобы включить','Откроется Happ с вашим ключом'],
  connecting:['Открываю Happ','Подтвердите добавление подписки'],
  opened:['Happ открыт','Включите VPN в Happ. Если он не открылся, установите его ниже']
};
function setState(s){PW.dataset.state=s;$('#plabel').textContent=TXT[s][0];$('#psub').textContent=TXT[s][1];}
setState(ACTIVE?'idle':IS_BLOCKED?'blocked':'nosub');

$('#pill').classList.toggle('on',ACTIVE);
$('#pilltxt').textContent=ACTIVE?(ON_TRIAL?'Пробный период':'Подписка активна'):IS_BLOCKED?'Заблокировано':'Нет подписки';
if(ACTIVE||IS_BLOCKED){
  $('#card').hidden=false;
  $('#cardL').textContent=ON_TRIAL?'Пробный период до':'Подписка до';
  $('#cardR').textContent=dt(EXP);
}
$('#trialBtn').hidden=TRIAL_USED||ACTIVE||IS_BLOCKED||EXPIRED;
$('#chBtn').hidden=!IS_BLOCKED;
$('#plansBtn').textContent=(ACTIVE&&!ON_TRIAL)||EXPIRED?'Продлить подписку':'Тарифы';

$('#trialBtn').onclick=()=>toBot('trial');
$('#chBtn').onclick=()=>{if(CH)openExt(CH);toBot('trial');};
$('#dlIos').onclick=()=>openExt('https://apps.apple.com/us/app/happ-proxy-utility/id6504287215');
$('#dlOther').onclick=()=>openExt('https://www.happ.su');

$('#pbtn').onclick=()=>{
  if(IS_BLOCKED){toast('Подпишитесь на канал, чтобы вернуть доступ');return;}
  if(!ACTIVE){toast(EXPIRED?'Подписка закончилась':'Сначала пробный период или тариф');return;}
  if(PW.dataset.state==='connecting')return;
  setState('connecting');haptic('heavy');
  setTimeout(()=>{
    if(tg&&tg.openLink){
      // внутри Telegram схема happ:// блокируется, поэтому идем через эту же страницу во внешнем браузере
      tg.openLink(location.origin+location.pathname+'#open='+encodeURIComponent(SUB));
    }else{location.href='happ://add/'+SUB;}
    setState('opened');
  },900);
};

/* ---- окно с тарифами ---- */
let sel='3m';
function renderPlans(){
  $('#plans').innerHTML=PLANS.map(p=>`
    <button class="plan" role="radio" aria-checked="${p.id===sel}" data-id="${p.id}">
      ${p.tag?`<span class="tag">${p.tag}</span>`:''}
      <span class="n">${p.n}</span><span class="m">${rub(p.mo)} в месяц</span>
      <span class="p">${rub(p.p)}</span>
    </button>`).join('');
  const p=PLANS.find(x=>x.id===sel);
  $('#buy').textContent=`Оплатить: ${p.n}, ${rub(p.p)}`;
}
const sheet=o=>document.body.classList.toggle('sheet-on',o);
$('#plans').onclick=e=>{const b=e.target.closest('.plan');if(!b||b.dataset.id===sel)return;sel=b.dataset.id;haptic();renderPlans();};
$('#plansBtn').onclick=()=>sheet(true);
$('#closeSheet').onclick=$('#shade').onclick=()=>sheet(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet(false);});
$('#buy').onclick=()=>toBot('buy_'+sel);
renderPlans();

/* ---- режим перехода в Happ: страница открыта во внешнем браузере по ссылке #open=... ---- */
if(location.hash.startsWith('#open=')){
  let sub='';try{sub=decodeURIComponent(location.hash.slice(6));}catch(e){}
  $('#openView').hidden=false;
  if(/^https?:\/\//.test(sub)){
    const deep='happ://add/'+sub;
    $('#oOpen').href=deep;
    setTimeout(()=>{location.href=deep;},300);
    setTimeout(()=>{$('#ot').textContent='Happ не открылся?';$('#os').textContent='Нажмите кнопку ниже. Если приложения нет, сначала установите его.';},2500);
  }else{
    $('#ot').textContent='Ключ не найден';$('#os').textContent='Вернитесь в бота и откройте EarthVPN снова.';$('#oOpen').hidden=true;
  }
}
</script>
</body>
</html>
